<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Japanese reading practice. Show each word's reading only when you want it.">
  <title>Japanese Study</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap bar">
      <a class="brand" href="index.html">Japanese Study</a>
      <div class="bar-actions">
        <a class="header-link" href="kanji.html">Kanji</a>
        <button id="lesson-menu-open" class="menu-open" type="button" aria-haspopup="dialog" aria-expanded="false" aria-controls="lesson-menu">Lessons</button>
      </div>
    </div>
  </header>
  <main class="wrap page">
    <p class="page-kicker">Lessons</p>
    <h1>Japanese Study</h1>
    <p class="lede">Reading practice for coached lessons. Kanji stay unmarked until you tap a word or show every reading.</p>
    <a class="lesson-card kanji-entry" href="kanji.html">
      <p class="level">Kanji</p>
      <h2>Kanji from every lesson</h2>
      <p class="card-summary">Grouped by character and approximate JLPT level, with a spelling game and saved scores.</p>
    </a>
    <p id="status" class="panel">Loading lessons…</p>
    <ul id="lesson-list" class="lesson-list"></ul>
    <div id="stories"></div>
  </main>
  <noscript>
    <p class="wrap panel error">This site needs JavaScript to load lessons.</p>
  </noscript>
  <script src="js/progress.js"></script>
  <script src="js/home.js"></script>
  <script src="js/menu.js"></script>
</body>
</html>
